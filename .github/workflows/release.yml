name: Release Cairn

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS installers
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x installers/build-macos.sh
          installers/build-macos.sh "${VERSION}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cairn-macos
          path: installers/output/*

  build-linux:
    name: Build Linux installers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x installers/build-linux.sh
          installers/build-linux.sh "${VERSION}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cairn-linux
          path: installers/output/*

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows artifacts
        shell: pwsh
        run: |
          $Version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          ./installers/build-windows.ps1 $Version

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cairn-windows
          path: installers/output/*

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cairn-macos
          path: artifacts/macos

      - name: Download Linux artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cairn-linux
          path: artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cairn-windows
          path: artifacts/windows

      # Publish stable, version-less copies alongside the versioned ones so the
      # website's `releases/latest/download/<name>` links resolve on every release.
      - name: Stage stable-named assets
        run: |
          mkdir -p artifacts/stable
          cp artifacts/macos/*.pkg     artifacts/stable/cairn-macos.pkg
          cp artifacts/macos/*.tar.gz  artifacts/stable/cairn-macos.tar.gz
          cp artifacts/linux/*.deb     artifacts/stable/cairn-linux.deb
          cp artifacts/linux/*.tar.gz  artifacts/stable/cairn-linux.tar.gz
          # NOTE: the Windows zip is already stable-named (cairn-windows-x64.zip)
          # and uploaded via artifacts/windows/*.zip. Do NOT copy it here — a second
          # file with the same basename makes softprops fail with
          # "Not Found - update-a-release-asset" (duplicate asset name).
          ls -la artifacts/stable

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          draft: false
          make_latest: true
          files: |
            artifacts/macos/*.pkg
            artifacts/macos/*.tar.gz
            artifacts/linux/*.deb
            artifacts/linux/*.tar.gz
            artifacts/windows/*.zip
            artifacts/stable/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # softprops/action-gh-release has, in practice, created drafts even with
      # draft:false set, so force-publish as the latest release explicitly.
      - name: Publish release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest --repo "${GITHUB_REPOSITORY}"
